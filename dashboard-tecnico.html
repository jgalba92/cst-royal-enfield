<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="auth.js?v=3"></script>
<script src="page-info.js?v=1"></script>
<title>CST · Mi taller</title>
<style>
  :root{
    --bg:#1A1A1A; --panel:#242424; --panel-2:#2E2E2E; --line:#3A3A3A;
    --ink:#F0F0F0; --muted:#888; --accent:#C8102E; --accent-ink:#C9A84C;
    --ok:#2ECC71; --bad:#FF4D4D; --radius:10px;
    --c-pend:#3B82F6; --c-trab:#A855F7; --c-listo:#2ECC71;
    --sans:'Inter','Segoe UI',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overflow-x:hidden;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;}
  .wrap{max-width:640px;margin:0 auto;padding:18px 14px 60px;min-width:0;}

  .top{display:flex;justify-content:space-between;align-items:center;
    padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px;gap:10px;}
  .top .who{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;}
  .top h1{font-size:20px;font-weight:650;margin-top:4px;}
  .logout{background:none;border:1px solid var(--line);color:var(--muted);
    padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:var(--sans);flex-shrink:0;}
  .logout:hover{border-color:var(--accent);color:var(--ink);}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
  .card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
    border-radius:var(--radius);padding:12px 10px;text-align:center;}
  .card.pend{border-left-color:var(--c-pend);}
  .card.trab{border-left-color:var(--c-trab);}
  .card.listo{border-left-color:var(--c-listo);}
  .card .n{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1;}
  .card.pend .n{color:var(--c-pend);}
  .card.trab .n{color:var(--c-trab);}
  .card.listo .n{color:var(--c-listo);}
  .card .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    font-weight:600;margin-top:5px;}

  .ministats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .mstat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
  .mstat .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;}
  .mstat .v{font-size:18px;font-weight:700;margin-top:6px;font-family:var(--mono);}
  .mstat .v small{font-size:12px;color:var(--muted);font-family:var(--sans);font-weight:600;}

  .alerta{display:none;margin:0 0 16px;padding:11px 14px;background:rgba(200,16,46,.14);
    border:1px solid var(--accent);border-radius:var(--radius);color:#ff8b98;font-size:13px;font-weight:600;}
  .alerta.info{background:var(--panel-2);border-color:var(--line);color:var(--muted);font-weight:400;}
  .alerta-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .alerta-toggle{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;
    padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;font-family:var(--sans);}
  .alerta-toggle:hover{background:rgba(255,255,255,.1);}
  .alerta-list{display:none;margin-top:10px;flex-direction:column;gap:6px;}
  .alerta-list.show{display:flex;}
  .alerta-item{background:rgba(0,0,0,.18);border-radius:7px;padding:8px 10px;font-size:12.5px;
    color:var(--ink);font-weight:500;border-left:3px solid var(--line);}
  .alerta-item .placa{font-family:var(--mono);font-weight:700;margin-right:6px;color:var(--ink);}
  .alerta-item.critica{border-left-color:var(--bad);}
  .alerta-item.revisar{border-left-color:var(--accent-ink);}
  .refresh-note{font-size:11px;color:var(--muted);margin:-8px 0 18px;}

  .grupos{min-width:0;}
  section.grupo{margin-bottom:20px;min-width:0;}
  .grupo-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .grupo-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .grupo-dot.pend{background:var(--c-pend);}
  .grupo-dot.trab{background:var(--c-trab);}
  .grupo-dot.listo{background:var(--c-listo);}
  .grupo-head h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink);font-weight:700;}
  .grupo-head .cnt{font-size:12px;color:var(--muted);font-family:var(--mono);}
  .grupo-nota{font-size:12px;color:var(--accent-ink);margin:-4px 0 10px;font-weight:600;
    overflow-wrap:break-word;word-break:break-word;}

  .moto-list{display:flex;flex-direction:column;gap:7px;min-width:0;}
  .moto-row{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;
    transition:border-color .15s,background .15s;min-width:0;}
  .moto-row:hover{border-color:#555;}
  .moto-row.oldest{border-color:var(--accent-ink);background:rgba(201,168,76,.08);}
  .moto-row.expanded{align-items:flex-start;}
  .moto-main{min-width:0;flex:1;overflow-wrap:break-word;word-break:break-word;}
  .moto-placa-row{display:flex;align-items:center;gap:6px;}
  .moto-placa{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.02em;}
  .moto-star{font-size:11px;color:var(--accent-ink);flex-shrink:0;}
  .moto-serv{font-size:12.5px;color:var(--muted);margin-top:2px;
    overflow-wrap:break-word;word-break:break-word;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .moto-row.expanded .moto-serv{display:block;-webkit-line-clamp:unset;overflow:visible;white-space:normal;}
  .moto-detail{display:none;font-size:11.5px;color:var(--muted);margin-top:6px;font-family:var(--mono);
    overflow-wrap:break-word;word-break:break-word;}
  .moto-row.expanded .moto-detail{display:block;}
  .moto-dias{text-align:right;flex-shrink:0;}
  .moto-dias .num{font-family:var(--mono);font-size:17px;font-weight:700;}
  .moto-dias .lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .moto-chevron{color:var(--muted);font-size:16px;flex-shrink:0;transition:transform .15s,color .15s;}
  .moto-row.expanded .moto-chevron{transform:rotate(90deg);color:var(--accent-ink);}

  .empty,.loading{padding:16px;text-align:center;color:var(--muted);font-size:13px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;}

  /* Grid de 3 columnas en desktop: .grupos y las 3 <section class="grupo">
     hijas directas (ver HTML) son las que reciben display:grid /
     grid-template-columns. El selector .grupos section.grupo (mayor
     especificidad que "section.grupo" de arriba) gana sin depender del
     orden en la hoja de estilos. */
  @media (min-width:769px){
    .wrap{max-width:1100px;}
    .grupos{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start;}
    .grupos section.grupo{margin-bottom:0;}
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="who" id="who">Técnico</div>
        <h1 id="titulo">Mi taller</h1>
      </div>
      <button class="logout" id="logout">Salir</button>
    </div>

    <div class="cards">
      <div class="card pend"><div class="n" id="cnt-pendiente">—</div><div class="lbl">Por empezar</div></div>
      <div class="card trab"><div class="n" id="cnt-trabajo">—</div><div class="lbl">En trabajo</div></div>
      <div class="card listo"><div class="n" id="cnt-listas">—</div><div class="lbl">Listas</div></div>
    </div>

    <div class="ministats">
      <div class="mstat">
        <div class="lbl">Más vieja</div>
        <div class="v" id="mv-valor">—</div>
      </div>
      <div class="mstat">
        <div class="lbl">Tu promedio</div>
        <div class="v">—</div>
      </div>
    </div>

    <div class="alerta" id="te-alerta">
      <div class="alerta-head">
        <span id="alerta-msg"></span>
        <button type="button" class="alerta-toggle" id="alerta-toggle" aria-expanded="false">Ver detalle ▾</button>
      </div>
      <div class="alerta-list" id="alerta-list"></div>
    </div>
    <div class="refresh-note">Actualiza cada hora.</div>

    <div class="grupos">
      <section class="grupo">
        <div class="grupo-head">
          <span class="grupo-dot pend"></span>
          <h2>Por empezar</h2>
          <span class="cnt" id="sec-pendiente-cnt"></span>
        </div>
        <div class="moto-list" id="sec-pendiente"><div class="loading">Cargando…</div></div>
      </section>

      <section class="grupo">
        <div class="grupo-head">
          <span class="grupo-dot trab"></span>
          <h2>En trabajo</h2>
          <span class="cnt" id="sec-trabajo-cnt"></span>
        </div>
        <div class="moto-list" id="sec-trabajo"><div class="loading">Cargando…</div></div>
      </section>

      <section class="grupo">
        <div class="grupo-head">
          <span class="grupo-dot listo"></span>
          <h2>Listas para entregar</h2>
          <span class="cnt" id="sec-listas-cnt"></span>
        </div>
        <div class="grupo-nota">Avisa al cliente.</div>
        <div class="moto-list" id="sec-listas"><div class="loading">Cargando…</div></div>
      </section>
    </div>
  </div>

<script>
const API = "https://cst-royal-enfield-api.juanguillermoalba.workers.dev";

/* Guard de sesion: solo tecnico */
const session = guard(["tecnico"]);
const nombre = (session && session.tecnico) || "";
document.getElementById("who").textContent = "Técnico · " + nombre;
document.getElementById("titulo").textContent = "Hola, " + nombre;
const logoutBtn = document.getElementById("logout");
if(logoutBtn){ logoutBtn.addEventListener("click", logout); }

function filaMoto(m, esLaMasVieja){
  const dias = (m.dias_en_taller === null || m.dias_en_taller === undefined) ? "—" : m.dias_en_taller;
  return (
    '<div class="moto-row' + (esLaMasVieja ? ' oldest' : '') + '">' +
      '<div class="moto-main">' +
        '<div class="moto-placa-row">' +
          '<span class="moto-placa">' + (m.placa || "—") + '</span>' +
          (esLaMasVieja ? '<span class="moto-star">★ más antigua</span>' : '') +
        '</div>' +
        '<div class="moto-serv">' + (m.servicio || "Sin descripción") + '</div>' +
        '<div class="moto-detail">Orden #' + (m.consecutivo || "—") + ' · Estado: ' + (m.estado || "—") + '</div>' +
      '</div>' +
      '<div class="moto-dias">' +
        '<div class="num">' + dias + '</div>' +
        '<div class="lbl">días</div>' +
      '</div>' +
      '<span class="moto-chevron">›</span>' +
    '</div>'
  );
}

/* Click en una moto expande/colapsa el servicio completo y su detalle.
   Delegado en document (se registra una sola vez, fuera de renderGrupo
   y de cargarTallerEstado): sigue funcionando aunque renderGrupo
   reescriba el innerHTML de .moto-list en cada refresco. */
document.addEventListener("click", e => {
  const row = e.target.closest(".moto-row");
  if(row) row.classList.toggle("expanded");
});

/* Alerta de inconsistencias: el botón solo abre/cierra la lista ya
   pintada por cargarTallerEstado(). */
const alertaToggle = document.getElementById("alerta-toggle");
const alertaListEl  = document.getElementById("alerta-list");
alertaToggle.addEventListener("click", () => {
  const abierta = alertaListEl.classList.toggle("show");
  alertaToggle.setAttribute("aria-expanded", abierta ? "true" : "false");
  alertaToggle.textContent = abierta ? "Ocultar detalle ▴" : "Ver detalle ▾";
});

/* Formato de plata colombiano: 1407795 -> $1.407.795 */
function fmtPesos(n){
  return "$" + new Intl.NumberFormat("es-CO").format(Math.round(Number(n) || 0));
}

/* El Worker arma la nota como texto plano con el monto crudo, ej.
   "Valor $23000000 supera 20M...". Reformateamos cualquier "$<digitos>"
   dentro del texto sin tocar el Worker. */
function conPesosFormateados(texto){
  return String(texto || "").replace(/\$(\d+)/g, (_, num) => fmtPesos(num));
}

function filaInconsistencia(it){
  const sev = it.severidad === "critica" ? "critica" : "revisar";
  return (
    '<div class="alerta-item ' + sev + '">' +
      '<span class="placa">' + (it.placa || "—") + '</span>' +
      conPesosFormateados(it.nota || "Revisar en Motokontrol.") +
    '</div>'
  );
}

function renderGrupo(id, cntId, motos, masViejaConsecutivo){
  document.getElementById(cntId).textContent = motos.length;
  const cont = document.getElementById(id);
  if(motos.length === 0){
    cont.innerHTML = '<div class="empty">Sin motos en este estado.</div>';
    return;
  }
  cont.innerHTML = motos
    .slice()
    .sort((a,b) => (b.dias_en_taller||0) - (a.dias_en_taller||0))
    .map(m => filaMoto(m, m.consecutivo === masViejaConsecutivo))
    .join("");
}

async function cargarTallerEstado(){
  try{
    const res = await authFetch(API + "/taller-estado");
    const data = await res.json();
    const misOrdenes = data.mis_ordenes || [];

    const porEstado = { "Pendiente": [], "En Atención": [], "Atendido": [] };
    misOrdenes.forEach(m => {
      if(porEstado[m.estado]) porEstado[m.estado].push(m);
    });

    document.getElementById("cnt-pendiente").textContent = porEstado["Pendiente"].length;
    document.getElementById("cnt-trabajo").textContent   = porEstado["En Atención"].length;
    document.getElementById("cnt-listas").textContent    = porEstado["Atendido"].length;

    let masVieja = null;
    misOrdenes.forEach(m => {
      if(m.dias_en_taller === null || m.dias_en_taller === undefined) return;
      if(!masVieja || m.dias_en_taller > masVieja.dias_en_taller) masVieja = m;
    });
    const mvEl = document.getElementById("mv-valor");
    if(masVieja){
      mvEl.innerHTML = masVieja.placa + ' <small>· ' + masVieja.dias_en_taller +
        (masVieja.dias_en_taller === 1 ? ' día' : ' días') + '</small>';
    }else{
      mvEl.textContent = "—";
    }

    renderGrupo("sec-pendiente", "sec-pendiente-cnt", porEstado["Pendiente"], masVieja && masVieja.consecutivo);
    renderGrupo("sec-trabajo",   "sec-trabajo-cnt",   porEstado["En Atención"], masVieja && masVieja.consecutivo);
    renderGrupo("sec-listas",    "sec-listas-cnt",    porEstado["Atendido"], masVieja && masVieja.consecutivo);

    const inconsistencias = data.inconsistencias || [];
    const alerta = document.getElementById("te-alerta");
    alerta.classList.remove("info");
    alertaToggle.style.display = "";
    if(inconsistencias.length > 0){
      document.getElementById("alerta-msg").textContent = inconsistencias.length +
        (inconsistencias.length === 1 ? " moto tuya para revisar en Motokontrol." : " motos tuyas para revisar en Motokontrol.");
      document.getElementById("alerta-list").innerHTML = inconsistencias.map(filaInconsistencia).join("");
      alerta.style.display = "block";
    }else{
      alerta.style.display = "none";
      alertaListEl.classList.remove("show");
      alertaToggle.setAttribute("aria-expanded", "false");
      alertaToggle.textContent = "Ver detalle ▾";
    }
  }catch(e){
    document.getElementById("cnt-pendiente").textContent = "—";
    document.getElementById("cnt-trabajo").textContent = "—";
    document.getElementById("cnt-listas").textContent = "—";
    document.getElementById("mv-valor").textContent = "—";
    ["sec-pendiente","sec-trabajo","sec-listas"].forEach(id => {
      document.getElementById(id).innerHTML = '<div class="empty">No se pudo cargar el estado del taller.</div>';
    });
    const alerta = document.getElementById("te-alerta");
    document.getElementById("alerta-msg").textContent = "No se pudo conectar con el servidor. Reintenta.";
    document.getElementById("alerta-list").innerHTML = "";
    alertaListEl.classList.remove("show");
    alertaToggle.style.display = "none";
    alerta.classList.add("info");
    alerta.style.display = "block";
  }
}
cargarTallerEstado();
setInterval(cargarTallerEstado, 3600000);
</script>
</body>
</html>
