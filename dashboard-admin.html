<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CST · Rendimiento del equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=1">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overflow-x:hidden;}
  body{font-family:var(--font-sans);background:var(--canvas);color:var(--text);min-height:100vh;}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px;min-width:0;}
  /* Reserva espacio para el rail del sidebar (sidebar.js) en desktop; en
     móvil el sidebar es un menú hamburguesa off-canvas, no ocupa espacio. */
  @media (min-width:769px){ body.cst-has-sidebar .wrap{padding-left:78px;} }

  .top{display:flex;justify-content:space-between;align-items:center;
    padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .top .who{font-family:var(--font-mono);font-size:12px;letter-spacing:.85px;text-transform:uppercase;
    color:var(--text-secondary);font-weight:500;}
  .top h1{font-size:22px;font-weight:650;margin-top:4px;}
  .logout{background:none;border:1px solid var(--border);color:var(--text-secondary);
    padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:var(--font-sans);flex-shrink:0;}
  .logout:hover{border-color:var(--divider);color:var(--text);}
  .refresh-note{font-size:11px;color:var(--text-secondary);margin:-16px 0 22px;}

  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-secondary);margin:6px 0 12px;font-weight:600;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:26px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px 18px;min-width:0;}
  .kpi .label{font-size:14px;color:var(--text-secondary);font-weight:400;}
  .kpi .val{font-family:var(--font-sans);font-size:clamp(24px,7vw,40px);font-weight:500;margin-top:8px;
    letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums;}
  .kpi.bad{border-left:3px solid var(--c-critica);}
  .kpi.bad .val{color:var(--c-critica);}

  .box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px 18px;min-width:0;}
  .empty,.loading{padding:16px;text-align:center;color:var(--text-secondary);font-size:13px;}

  .carga-row{margin-bottom:14px;}
  .carga-row:last-child{margin-bottom:0;}
  .carga-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px;}
  .carga-head .nombre{font-weight:600;overflow-wrap:break-word;word-break:break-word;min-width:0;}
  .carga-head .nombre.alerta{color:var(--c-critica);}
  .carga-head .nums{color:var(--text-secondary);font-family:var(--font-mono);flex-shrink:0;}
  .carga-bar{height:7px;border-radius:99px;background:var(--elevated);overflow:hidden;display:flex;}
  .carga-bar i{display:block;height:100%;}
  .carga-bar i.activas{background:var(--c-trab);}
  .carga-bar i.terminadas{background:var(--c-listo);}
  .carga-row.alerta .carga-bar i.activas{background:var(--c-critica);}

  .cuello-nota{color:var(--text-secondary);font-size:13px;line-height:1.5;}
  .cuello-filtro{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .cuello-filtro label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--text-secondary);font-weight:600;}
  .cuello-filtro select{background:var(--elevated);border:1px solid var(--border);border-radius:7px;
    color:var(--text);font-family:var(--font-sans);font-size:13px;padding:7px 10px;outline:none;}
  .cuello-filtro select:focus{border-color:var(--accent);}
  .carga-bar i.cuello{background:var(--accent);}
  /* El promedio se lee fuerte; el número de motos queda tenue para que se note
     cuando el dato sale de muy pocos casos. */
  .cuello-valor{color:var(--text);font-weight:600;}
  .cuello-nota strong{color:var(--text);}

  .filtros{display:flex;flex-wrap:wrap;align-items:end;gap:10px;margin:24px 0 14px;}
  .filtro-campo{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .filtro-campo label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);font-weight:600;}
  .filtro-campo select,.filtro-campo input{
    background:var(--elevated);border:1px solid var(--border);border-radius:7px;color:var(--text);
    font-family:var(--font-sans);font-size:13px;padding:8px 10px;min-width:0;}
  .filtro-campo select:focus,.filtro-campo input:focus{outline:none;border-color:var(--accent);}
  .btn-exportar{margin-left:auto;background:transparent;border:1px solid var(--divider);color:var(--text);
    border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-sans);flex-shrink:0;}
  .btn-exportar:hover{border-color:var(--accent);color:var(--accent);}
  .btn-exportar:disabled{opacity:.4;cursor:default;}
  .contador-filtro{font-size:12px;color:var(--text-secondary);margin-bottom:10px;}

  .tabla-wrap{border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;min-width:0;}
  .tabla-scroll{max-height:520px;overflow-y:auto;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:640px;}
  th,td{padding:10px 12px;text-align:left;font-size:12.5px;border-bottom:1px solid var(--border);
    overflow-wrap:break-word;word-break:break-word;}
  th{background:var(--elevated);color:var(--text-secondary);font-family:var(--font-mono);font-size:12px;
    text-transform:uppercase;letter-spacing:.85px;position:sticky;top:0;z-index:1;}
  tbody tr{background:var(--card);}
  tbody tr:hover{background:var(--elevated);}
  tbody tr:last-child td{border-bottom:none;}
  td.placa{font-family:var(--font-mono);font-size:13px;letter-spacing:.85px;text-transform:uppercase;
    font-weight:700;color:var(--text);}
  td.ticket{font-family:var(--font-mono);font-size:12px;letter-spacing:.85px;text-transform:uppercase;
    color:var(--text-secondary);}
  td.dias,th.dias,td.valor,th.valor{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  td.valor .tenue{color:var(--text-secondary);font-style:italic;}
  td.valor .factura-sub{display:block;font-family:var(--font-mono);font-size:12px;letter-spacing:.85px;
    text-transform:uppercase;color:var(--text-secondary);font-weight:400;margin-top:2px;}
  .estado-pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:var(--radius-pill);font-weight:600;}
  .estado-pill.pend{background:rgba(59,130,246,.15);color:var(--c-pend);}
  .estado-pill.trab{background:rgba(168,85,247,.15);color:var(--c-trab);}
  .estado-pill.listo{background:rgba(46,204,113,.15);color:var(--c-listo);}
  .badge-verificar{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:var(--radius-pill);
    font-weight:600;margin-left:6px;background:rgba(249,115,22,.15);color:var(--c-revisar);
    white-space:nowrap;}

  @media (max-width:640px){
    th,td{padding:8px 8px;font-size:11.5px;}
    .btn-exportar{margin-left:0;width:100%;}
  }


  /* Ícono de ayuda: círculo con "i" y tooltip al pasar el mouse o al tocarlo */
  .info{display:inline-flex;align-items:center;justify-content:center;position:relative;
    width:16px;height:16px;margin-left:6px;border-radius:50%;border:1px solid var(--border);
    background:none;color:var(--text-secondary);font-family:var(--font-sans);font-size:10px;font-weight:700;
    font-style:normal;line-height:1;letter-spacing:0;text-transform:none;cursor:pointer;
    vertical-align:middle;flex-shrink:0;-webkit-user-select:none;user-select:none;}
  .info:hover,.info:focus,.info.abierto{color:var(--accent);border-color:var(--accent);}
  .info::after{content:attr(data-info);position:absolute;bottom:calc(100% + 8px);left:50%;
    transform:translateX(-50%);width:max-content;max-width:240px;padding:8px 10px;
    background:var(--elevated);color:var(--text);border:1px solid var(--divider);border-radius:8px;
    font-size:11.5px;font-weight:500;line-height:1.45;letter-spacing:0;text-transform:none;
    text-align:left;white-space:normal;
    opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none;z-index:60;}
  .info:hover::after,.info:focus::after,.info.abierto::after{opacity:1;visibility:visible;}
  .info.der::after{left:auto;right:-6px;transform:none;}
</style>
</head>
<body>
  <div class="wrap">
    <a href="index.html" id="link-menu" style="display:none;align-items:center;gap:4px;color:var(--accent);font-size:13px;font-weight:600;text-decoration:none;margin-bottom:12px">← Menú</a>
    <div class="top">
      <div style="display:flex;align-items:center;gap:12px">
        <img src="assets/re-blanco.png" alt="Royal Enfield" style="height:36px;width:auto">
        <div>
          <div class="who">Datos del taller</div>
          <h1 id="titulo">Rendimiento del equipo</h1>
        </div>
      </div>
      <button class="logout" id="logout">Salir</button>
    </div>
    <div class="refresh-note">Actualiza cada hora.</div>

    <div class="kpis">
      <div class="kpi"><div class="label">En taller<span class="info" tabindex="0" data-info="Total de motos que están en el taller ahora mismo (sin entregar).">i</span></div><div class="val" id="kpi-entaller">—</div></div>
      <div class="kpi"><div class="label">Trabajando<span class="info" tabindex="0" data-info="Motos que se están reparando en este momento.">i</span></div><div class="val" id="kpi-trabajando">—</div></div>
      <div class="kpi"><div class="label">Por entregar<span class="info" tabindex="0" data-info="Motos terminadas esperando que el cliente las recoja.">i</span></div><div class="val" id="kpi-terminadas">—</div></div>
      <div class="kpi bad"><div class="label">Críticas<span class="info der" tabindex="0" data-info="Órdenes con algo inusual que conviene revisar en Motokontrol.">i</span></div><div class="val" id="kpi-criticas">—</div></div>
    </div>

    <h2>Carga por técnico<span class="info" tabindex="0" data-info="Cuántas motos tiene cada técnico: en reparación (morado) y ya terminadas (verde).">i</span></h2>
    <div class="box" id="carga-tecnico" style="margin-bottom:22px">
      <div class="loading">Cargando…</div>
    </div>

    <h2>¿Dónde se atasca?<span class="info" tabindex="0" data-info="En qué etapa se demoran más las motos. Ayuda a ver dónde está el cuello de botella.">i</span></h2>
    <div class="box" style="margin-bottom:28px">
      <div class="cuello-filtro">
        <label for="cuello-tecnico">Técnico</label>
        <select id="cuello-tecnico"><option value="">Todos</option></select>
      </div>
      <div id="cuello-barras"><div class="loading">Cargando…</div></div>
    </div>

    <h2>Órdenes en taller<span class="info" tabindex="0" data-info="Lista de todas las motos en el taller. Usa los filtros para buscar por técnico, fechas, estado o inconsistencia, y exporta a Excel con el botón CSV.">i</span></h2>
    <div class="filtros">
      <div class="filtro-campo">
        <label for="filtro-tecnico">Técnico</label>
        <select id="filtro-tecnico"><option value="">Todos</option></select>
      </div>
      <div class="filtro-campo">
        <label for="filtro-desde">Ingreso desde</label>
        <input type="date" id="filtro-desde">
      </div>
      <div class="filtro-campo">
        <label for="filtro-hasta">Ingreso hasta</label>
        <input type="date" id="filtro-hasta">
      </div>
      <div class="filtro-campo">
        <label for="filtro-estado">Estado</label>
        <select id="filtro-estado">
          <option value="">Todos</option>
          <option value="Pendiente">Por empezar</option>
          <option value="En Atención">En trabajo</option>
          <option value="Atendido">Por entregar</option>
        </select>
      </div>
      <div class="filtro-campo">
        <label for="filtro-inconsistencia">Inconsistencia</label>
        <select id="filtro-inconsistencia">
          <option value="">Todas</option>
          <option value="critica">Críticas</option>
          <option value="limpia">Limpias</option>
        </select>
      </div>
      <button type="button" class="btn-exportar" id="btn-exportar">Exportar CSV</button>
    </div>

    <div class="contador-filtro" id="contador-filtro"></div>

    <div class="tabla-wrap">
      <div class="tabla-scroll">
        <table id="tabla-ordenes">
          <thead>
            <tr id="tabla-head">
              <th>Ticket</th>
              <th>Placa</th>
              <th>Técnico</th>
              <th>Estado</th>
              <th>Servicio</th>
              <th class="dias">Días</th>
              <th class="valor">Valor</th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr><td colspan="7" class="loading">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

<script>
const API = "https://cst-royal-enfield-api.juanguillermoalba.workers.dev";

/* Guard de sesion: admin, manager, developer */
const session = guard(["admin","manager","developer"]);
const logoutBtn = document.getElementById("logout");
if(logoutBtn){ logoutBtn.addEventListener("click", logout); }

/* Formato de plata colombiano: 1407795 -> $1.407.795 */
function fmtPesos(n){
  return "$" + new Intl.NumberFormat("es-CO").format(Math.round(Number(n) || 0));
}

const ESTADO_INFO = {
  "Pendiente":   { clase: "pend",  label: "Pendiente" },
  "En Atención": { clase: "trab",  label: "En trabajo" },
  "Atendido":    { clase: "listo", label: "Por entregar" },
};

let todasOrdenes = [];

/* ── ¿Dónde se atasca? ────────────────────────────────────────────────────
   Tiempo promedio que una moto pasa en cada estado. El Worker manda el
   agregado general y el desglose por técnico; el filtro decide cuál se
   pinta, sin volver a pedir nada al servidor. */
const CUELLO_ETAPAS = [
  { estado: "Pendiente",   label: "Esperando inicio" },
  { estado: "En Atención", label: "En reparación" },
  { estado: "Atendido",    label: "Esperando entrega" },
];
let cuelloGeneral = [];
let cuelloPorTecnico = [];

/* Bajo un día el promedio en días no dice nada ("0.3 días"), así que ahí se
   muestra en horas. */
function fmtDuracion(fila){
  const dias = fila.promedio_dias ?? 0;
  if(dias >= 1) return dias + (dias === 1 ? " día" : " días");
  const horas = fila.promedio_horas ?? 0;
  return horas + (horas === 1 ? " hora" : " horas");
}

function poblarFiltroCuello(){
  const sel = document.getElementById("cuello-tecnico");
  const previo = sel.value;
  const tecnicos = [...new Set(cuelloPorTecnico.map(f => f.tecnico).filter(Boolean))].sort();

  sel.innerHTML = "";
  const todos = document.createElement("option");
  todos.value = ""; todos.textContent = "Todos";
  sel.appendChild(todos);
  for(const t of tecnicos){
    const o = document.createElement("option");
    o.value = t; o.textContent = t;
    sel.appendChild(o);
  }
  // Al refrescar cada hora no se pierde el técnico que el usuario eligió.
  if(previo && tecnicos.includes(previo)) sel.value = previo;
}

function renderCuelloBotella(){
  const cont = document.getElementById("cuello-barras");
  const tecnico = document.getElementById("cuello-tecnico").value;
  const filas = tecnico
    ? cuelloPorTecnico.filter(f => f.tecnico === tecnico)
    : cuelloGeneral;

  const porEstado = {};
  for(const f of (filas || [])) porEstado[f.estado] = f;

  const max = Math.max(1, ...(filas || []).map(f => f.promedio_horas || 0));
  const barras = CUELLO_ETAPAS.map(e => {
    const f = porEstado[e.estado];
    if(!f) return "";
    const pct = Math.round(((f.promedio_horas || 0) / max) * 100);
    const motos = f.muestras === 1 ? "1 moto" : (f.muestras ?? 0) + " motos";
    return (
      '<div class="carga-row">' +
        '<div class="carga-head">' +
          '<span class="nombre">' + e.label + '</span>' +
          '<span class="nums"><span class="cuello-valor">' + fmtDuracion(f) + '</span> (' + motos + ')</span>' +
        '</div>' +
        '<div class="carga-bar"><i class="cuello" style="width:' + pct + '%"></i></div>' +
      '</div>'
    );
  }).join("");

  cont.innerHTML = barras ||
    '<div class="cuello-nota">Aún acumulando datos, disponible en unos días.</div>';
}

document.getElementById("cuello-tecnico").addEventListener("change", renderCuelloBotella);

function renderCargaTecnico(porTecnico){
  const cont = document.getElementById("carga-tecnico");
  if(!porTecnico || !porTecnico.length){
    cont.innerHTML = '<div class="empty">Sin datos</div>';
    return;
  }
  const ordenado = porTecnico.slice().sort((a,b) => (b.activas||0) - (a.activas||0));
  const maxTotal = Math.max(1, ...ordenado.map(t => (t.activas||0) + (t.terminadas||0)));
  cont.innerHTML = ordenado.map(t => {
    const esAlerta = t.tecnico === "Tecnico De";
    const pctActivas = Math.round(((t.activas||0) / maxTotal) * 100);
    const pctTerminadas = Math.round(((t.terminadas||0) / maxTotal) * 100);
    return (
      '<div class="carga-row' + (esAlerta ? ' alerta' : '') + '">' +
        '<div class="carga-head">' +
          '<span class="nombre' + (esAlerta ? ' alerta' : '') + '">' + (t.tecnico || "Sin técnico") + '</span>' +
          '<span class="nums">' + (t.activas||0) + '·' + (t.terminadas||0) + '</span>' +
        '</div>' +
        '<div class="carga-bar">' +
          '<i class="activas" style="width:' + pctActivas + '%"></i>' +
          '<i class="terminadas" style="width:' + pctTerminadas + '%"></i>' +
        '</div>' +
      '</div>'
    );
  }).join("");
}

/* fecha_ingreso viene de ordenes_mk (ej. "2026-08-30T00:00:00.000Z" o
   "2026-08-30"); nos quedamos con los primeros 10 caracteres (YYYY-MM-DD)
   y parseamos a medianoche local para comparar por día contra los inputs
   date del filtro. */
function fechaIngresoReal(fechaIngreso){
  if(!fechaIngreso) return null;
  const d = new Date(String(fechaIngreso).slice(0, 10) + "T00:00:00");
  return isNaN(d.getTime()) ? null : d;
}

function parseFechaInput(valor){
  if(!valor) return null;
  const d = new Date(valor + "T00:00:00");
  return isNaN(d.getTime()) ? null : d;
}

/* Misma clasificación que usa el Worker para "inconsistencias", pero
   aplicada aquí a cualquier orden de todas_ordenes para el filtro. */
function clasificarInconsistencia(o){
  if(o.tecnico === "Tecnico De") return "critica";
  return "limpia";
}

function filtrarYOrdenar(){
  const tecnicoSel = document.getElementById("filtro-tecnico").value;
  const estadoSel = document.getElementById("filtro-estado").value;
  const inconsistenciaSel = document.getElementById("filtro-inconsistencia").value;
  const desde = parseFechaInput(document.getElementById("filtro-desde").value);
  const hasta = parseFechaInput(document.getElementById("filtro-hasta").value);

  return todasOrdenes
    .filter(o => !tecnicoSel || o.tecnico === tecnicoSel)
    .filter(o => !estadoSel || o.estado === estadoSel)
    .filter(o => !inconsistenciaSel || clasificarInconsistencia(o) === inconsistenciaSel)
    .filter(o => {
      if(!desde && !hasta) return true;
      const fecha = fechaIngresoReal(o.fecha_ingreso);
      if(!fecha) return false;
      if(desde && fecha < desde) return false;
      if(hasta && fecha > hasta) return false;
      return true;
    })
    .slice()
    .sort((a,b) => (b.dias_en_taller ?? -1) - (a.dias_en_taller ?? -1));
}

/* Valor: sale de Siigo, nunca de Motokontrol (ese total viene inflado por un
   factor variable y el Worker ya no lo manda para este rol). Sin factura
   (valor_siigo null) se muestra "sin facturar"; con factura, el número de
   factura va debajo en chico para poder ubicarla en Siigo. */
function celdaValor(o){
  if(o.valor_siigo === null || o.valor_siigo === undefined){
    return '<span class="tenue">sin facturar</span>';
  }
  const factura = o.numero_factura
    ? '<span class="factura-sub">' + o.numero_factura + '</span>'
    : '';
  return fmtPesos(o.valor_siigo) + factura;
}

function filaTabla(o){
  const info = ESTADO_INFO[o.estado] || { clase: "pend", label: o.estado || "—" };
  const dias = (o.dias_en_taller === null || o.dias_en_taller === undefined) ? "—" : o.dias_en_taller;
  const badge = o.facturada_sin_entregar
    ? '<span class="badge-verificar">Facturada, verificar entrega</span>'
    : '';
  return (
    '<tr>' +
      '<td class="ticket">' + (o.ticket ?? "—") + '</td>' +
      '<td class="placa">' + (o.placa || "—") + '</td>' +
      '<td>' + (o.tecnico || "—") + '</td>' +
      '<td><span class="estado-pill ' + info.clase + '">' + info.label + '</span>' + badge + '</td>' +
      '<td>' + (o.servicio || "Sin descripción") + '</td>' +
      '<td class="dias">' + dias + '</td>' +
      '<td class="valor">' + celdaValor(o) + '</td>' +
    '</tr>'
  );
}

function actualizarContador(n){
  const el = document.getElementById("contador-filtro");
  if(!el) return;
  const total = todasOrdenes.length;
  el.textContent = n + " de " + total + (total === 1 ? " orden" : " órdenes");
}

function renderTabla(){
  const filas = filtrarYOrdenar();
  actualizarContador(filas.length);
  const cuerpo = document.getElementById("tabla-body");
  const colspan = 7;
  if(filas.length === 0){
    cuerpo.innerHTML = '<tr><td colspan="' + colspan + '" class="empty">Sin órdenes que coincidan con el filtro.</td></tr>';
    return;
  }
  cuerpo.innerHTML = filas.map(filaTabla).join("");
}

function poblarFiltroTecnico(){
  const select = document.getElementById("filtro-tecnico");
  const actual = select.value;
  const tecnicos = Array.from(new Set(todasOrdenes.map(o => o.tecnico).filter(Boolean))).sort();
  select.innerHTML = '<option value="">Todos</option>' +
    tecnicos.map(t => '<option value="' + t + '">' + t + '</option>').join("");
  if(tecnicos.includes(actual)) select.value = actual;
}

/* CSV de la tabla ya filtrada/ordenada. */
function celdaCSV(valor){
  const s = String(valor == null ? "" : valor);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportarCSV(){
  const filas = filtrarYOrdenar();
  const encabezados = ["Ticket","Placa","Técnico","Estado","Servicio","Días","Valor","Factura","Facturada sin entregar"];

  const lineas = [encabezados.map(celdaCSV).join(",")];
  filas.forEach(o => {
    const info = ESTADO_INFO[o.estado] || { label: o.estado || "—" };
    const fila = [
      o.ticket ?? "",
      o.placa || "",
      o.tecnico || "",
      info.label,
      o.servicio || "",
      (o.dias_en_taller === null || o.dias_en_taller === undefined) ? "" : o.dias_en_taller,
      (o.valor_siigo === null || o.valor_siigo === undefined) ? "sin facturar" : o.valor_siigo,
      o.numero_factura ?? "",
      o.facturada_sin_entregar ? "si" : "",
    ];
    lineas.push(fila.map(celdaCSV).join(","));
  });

  const csv = "﻿" + lineas.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ordenes-taller-" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById("filtro-tecnico").addEventListener("change", renderTabla);
document.getElementById("filtro-estado").addEventListener("change", renderTabla);
document.getElementById("filtro-inconsistencia").addEventListener("change", renderTabla);
document.getElementById("filtro-desde").addEventListener("change", renderTabla);
document.getElementById("filtro-hasta").addEventListener("change", renderTabla);
document.getElementById("btn-exportar").addEventListener("click", exportarCSV);

async function cargarTallerEstado(){
  try{
    const res = await authFetch(API + "/taller-estado");
    const data = await res.json();
    const r = data.resumen || {};

    document.getElementById("kpi-entaller").textContent = r.en_taller ?? "—";
    document.getElementById("kpi-trabajando").textContent = r.trabajando ?? "—";
    document.getElementById("kpi-terminadas").textContent = r.terminadas ?? "—";
    document.getElementById("kpi-criticas").textContent = data.criticas ?? 0;

    const mg = data.manager || {};
    cuelloGeneral = mg.tiempo_por_estado || [];
    cuelloPorTecnico = mg.tiempo_por_estado_tecnico || [];
    poblarFiltroCuello();
    renderCuelloBotella();

    renderCargaTecnico(data.por_tecnico || []);

    todasOrdenes = data.todas_ordenes || [];
    poblarFiltroTecnico();
    renderTabla();
  }catch(e){
    document.getElementById("kpi-entaller").textContent = "—";
    document.getElementById("kpi-trabajando").textContent = "—";
    document.getElementById("kpi-terminadas").textContent = "—";
    document.getElementById("kpi-criticas").textContent = "—";
    document.getElementById("carga-tecnico").innerHTML = '<div class="empty">No se pudo cargar.</div>';
    document.getElementById("cuello-barras").innerHTML = '<div class="empty">No se pudo cargar.</div>';
    document.getElementById("contador-filtro").textContent = "";
    const colspan = 7;
    document.getElementById("tabla-body").innerHTML =
      '<tr><td colspan="' + colspan + '" class="empty">No se pudo conectar con el servidor. Reintenta.</td></tr>';
  }
}
cargarTallerEstado();
setInterval(cargarTallerEstado, 3600000);
